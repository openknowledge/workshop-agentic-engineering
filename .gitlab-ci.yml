# tag::maven-build[]
maven-build:
  stage: build
  image: maven:3.9.9-eclipse-temurin-21
  variables:
    # The Vite dev server is started by Playwright BEFORE `globalSetup`,
    # so we must set the proxy target statically in the job environment here.
    # In the DinD setup, the backend stack is reachable via the service alias `docker`.
    VITE_BACKEND_ENDPOINT: "http://docker:8080"
    # Playwright stores browser binaries under ~/.cache/ms-playwright/ by default.
    # We redirect them to a path within the project directory so that the
    # GitLab cache (see `cache:` above) can reuse them between builds.
    PLAYWRIGHT_BROWSERS_PATH: "${CI_PROJECT_DIR}/basisprojekt-client/.cache/ms-playwright"
  before_script:
    - echo api.version=1.44 >> ~/.docker-java.properties
    # Chromium runtime dependencies for Playwright (see https://playwright.dev/docs/ci#system-dependencies)
    # plus curl/ca-certificates for the Docker CLI download.
    # The `t64` suffixes apply starting with Ubuntu 24.04 (Noble); on Jammy there are transitional packages with the same name.
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends
        libnss3 libnspr4 libdbus-1-3 libdrm2 libgbm1 libxkbcommon0
        libpango-1.0-0 libcairo2 libx11-6 libxcb1 libxext6
        libxcomposite1 libxdamage1 libxfixes3 libxrandr2
        libatk1.0-0t64 libatk-bridge2.0-0t64 libatspi2.0-0t64
        libasound2t64 libcups2t64
        curl ca-certificates
    # Testcontainers' DockerComposeEnvironment internally spawns `docker compose`,
    # so the CLI + Compose plugin must be present in the image.
    - curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-27.5.1.tgz -o /tmp/docker.tgz
    - tar -xzf /tmp/docker.tgz -C /tmp
    - install -m 0755 /tmp/docker/docker /usr/local/bin/docker
    - mkdir -p /usr/local/lib/docker/cli-plugins
    - curl -fsSL https://github.com/docker/compose/releases/download/v2.32.4/docker-compose-linux-x86_64 -o /usr/local/lib/docker/cli-plugins/docker-compose
    - chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
  script:
    # First build the docker image. It is required by the fontend tests.
    - docker compose build
    - mvn clean install
  artifacts:
    paths:
      - basisprojekt-server/target/
    expire_in: 1 week
# end::maven-build[]


build-docker-image:
  image: docker:24.0.5
  stage: publish
  variables:
    BACKEND_IMAGE: $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA
  services:
    - docker:24.0.5-dind
  script:
    - echo "$CI_JOB_TOKEN" | docker login -u gitlab-ci-token --password-stdin $CI_REGISTRY
    - docker build -t $BACKEND_IMAGE -f Dockerfile .
    - docker push $BACKEND_IMAGE

# tag::release-rules[]
.release_rules:
  rules:
    # Do not run on merge requests
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    # Only run this deployment job on the development branch
    - if: '$CI_COMMIT_REF_NAME == "develop"'
      when: always
      variables:
        DOCKER_TAG: dev
        COMPOSE_ID: $DOKPLOY_DEV_COMPOSE_ID
    - if: '$CI_COMMIT_REF_NAME == "main"'
      when: always
      variables:
        DOCKER_TAG: latest
        COMPOSE_ID: $DOKPLOY_PRODUCTION_COMPOSE_ID
    # Do not run for other branches
    - when: never
# end::release-rules[]

release:
  extends:
    - .release_rules
  image: docker:29.4.0
  stage: deploy
  variables:
    BACKEND_IMAGE: $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA
    BACKEND_TAG_IMAGE: $CI_REGISTRY_IMAGE/backend:$DOCKER_TAG
  services:
    - docker:24.0.5-dind
  script:
    - echo "$CI_JOB_TOKEN" | docker login -u gitlab-ci-token --password-stdin $CI_REGISTRY
    - docker pull $BACKEND_IMAGE
    - docker tag $BACKEND_IMAGE $BACKEND_TAG_IMAGE
    - docker push $BACKEND_TAG_IMAGE

deploy:
  extends:
    - .release_rules
  needs:
    - release
  when: on_success
  image: curlimages/curl:8.19.0
  stage: deploy
  variables:
    API_KEY: $DOKPLOY_DEPLOYMENT_KEY
    COMPOSE_ID: $COMPOSE_ID
    DOCKER_TAG: $DOCKER_TAG
  script:
    - echo "Deploying ${DOCKER_TAG} on compose with ID ${COMPOSE_ID}..."
    - echo
    - |
      curl -X 'POST' \
      'https://dokploy.apps.openknowledge.services/api/compose.deploy' \
      -H 'accept: application/json' \
      -H 'Content-Type: application/json' \
      -H "x-api-key: ${API_KEY}" \
      -d "{ \"composeId\": \"${COMPOSE_ID}\" }"