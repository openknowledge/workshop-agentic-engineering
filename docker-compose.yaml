services:
# tag::database[]
  basisprojekt-database:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: geheim
    ports:
      - 5432:5432

  flyway:
    image: flyway/flyway:10.22
    command: migrate -locations=filesystem:/flyway/sql,filesystem:/flyway/testdata -user=postgres -password=geheim -connectRetries=60 -url=jdbc:postgresql://basisprojekt-database:5432/postgres
    depends_on:
      basisprojekt-database:
        condition: service_started
    volumes:
      - ./basisprojekt-server/src/main/resources/db/migration:/flyway/sql
      - ./basisprojekt-server/src/test/resources/db/testdata.sql:/flyway/testdata/V5.0.0__insert-testdata.sql
# end::database[]

# tag::wiremock[]
  wiremock:
    image: wiremock/wiremock:3.9.2
    ports:
      - 8089:8080
    volumes:
      - ./wiremock:/home/wiremock
    command:
      - --verbose
# end::wiremock[]

# tag::server[]
  basisprojekt-server:
    build:
      context: .
    ports:
      - 8080:8080
# end::server[]
# tag::database-configuration[]
    environment:
      SPRING_PROFILES_ACTIVE: default
      SPRING_DATASOURCE_URL: jdbc:postgresql://basisprojekt-database:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: geheim
      OTEL_SERVICE_NAME: basisprojekt-server
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      TODO_URL: http://wiremock:8080
    depends_on:
      basisprojekt-database:
        condition: service_started
      otel-collector:
        condition: service_started
      flyway:
        condition: service_completed_successfully
      wiremock:
        condition: service_started
# end::database-configuration[]

# OpenTelemetry Collector (inline config mounted from repo)
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.150.1
    command: ["--config=/etc/otel-collector-config.yaml"]
    environment:
      OTLP_ENVIRONMENT: local
    volumes:
      - ./deployment/configs/opentelemetry-collector-config-local.yaml:/etc/otel-collector-config.yaml:ro

