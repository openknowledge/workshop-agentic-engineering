name: Build

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  maven-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn --batch-mode clean install

      - name: Upload server artifact
        uses: actions/upload-artifact@v4
        with:
          name: customer-management-server-target
          path: customer-management-server/target/
          retention-days: 7
