receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"

processors:
  resourcedetection:
    # Wichtig, damit 'host.name' für deinen Server-Connector korrekt gesetzt wird
    detectors: [env, system]
    timeout: 2s
  attributes:
    actions:
      - key: environment
        value: ${env:OTLP_ENVIRONMENT}
        action: upsert
  batch:
    send_batch_size: 10000
    timeout: 10s

extensions:
  bearertokenauth:
    # Muss mit dem Token deines Servers übereinstimmen
    token: ${env:OTLP_TOKEN}

exporters:
  otlp_http:
    endpoint: https://http-otlp.monitoring.openknowledge.services
    auth:
      authenticator: bearertokenauth
  debug:

service:
  extensions: [bearertokenauth]
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [resourcedetection, attributes, batch]
      exporters: [otlp_http]
    logs:
      receivers: [otlp]
      processors: [resourcedetection, attributes, batch]
      exporters: [otlp_http]
    traces:
      receivers: [otlp]
      processors: [resourcedetection, attributes, batch]
      exporters: [otlp_http]