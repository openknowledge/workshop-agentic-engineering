receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"

processors:
  resourcedetection:
    # Wichtig, damit 'host.name' für deinen Server-Connector korrekt gesetzt wird
    detectors: [env, system]
    timeout: 2s
  attributes:
    actions:
      - key: environment
        value: ${env:OTLP_ENVIRONMENT}
        action: upsert
  batch:
    send_batch_size: 10000
    timeout: 10s

exporters:
  debug:

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [resourcedetection, attributes, batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [resourcedetection, attributes, batch]
      exporters: [debug]
    traces:
      receivers: [otlp]
      processors: [resourcedetection, attributes, batch]
      exporters: [debug]